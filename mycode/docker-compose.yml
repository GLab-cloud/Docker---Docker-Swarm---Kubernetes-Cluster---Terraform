version: '3.8'

# NETWORK
networks:
  my-network:
    driver: bridge

# VOLUMES
volumes:
  dir-site:
    driver: local
    driver_opts:
      type: none
      device: ./sites
      o: bind

services:
  # Container PHP
  my-php:
    container_name: php-product
    build:
      dockerfile: Dockerfile
      context: ./php/
    hostname: php
    restart: always
    networks:
      - my-network
    volumes:
      - dir-site:/home/sites

  # Container httpd (Apache)
  my-httpd:
    container_name: c-httpd1
    image: "httpd:latest"
    hostname: httpd
    restart: always
    networks:
      - my-network
    volumes:
      - dir-site:/home/sites
      - ./httpd1.cnf:/usr/local/apache2/conf/httpd.conf
    ports:
      - "9999:80"
      - "443:443"

  # Container MySQL
  my-mysql:
    container_name: mysql-product
    image: "mysql:8.0.33"
    hostname: mysql
    restart: always
    networks:
      - my-network
    volumes:
      - ./db:/var/lib/mysql
      - ./my.cnf:/etc/my.cnf
    environment:
      - MYSQL_ROOT_PASSWORD: abc123
      - MYSQL_DATABASE: db_site
      - MYSQL_USER: siteuser
      - MYSQL_PASSWORD: sitepass
